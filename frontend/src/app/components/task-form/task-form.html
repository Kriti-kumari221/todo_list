<div class="glass-panel form-card">
  <div class="form-header">
    <h3>{{ isEditing ? 'Edit Task' : 'Add New Task' }}</h3>
  </div>
  
  <form (ngSubmit)="onSubmit()" #taskForm="ngForm">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" class="form-control" name="title" [(ngModel)]="task.title" required placeholder="What needs to be done?">
    </div>
    
    <div class="form-group">
      <label for="description">Description (Optional)</label>
      <textarea id="description" class="form-control" name="description" [(ngModel)]="task.description" rows="3" placeholder="Add some details..."></textarea>
    </div>
    
    <div class="form-actions">
      <button type="button" class="btn-secondary" *ngIf="isEditing" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="!taskForm.form.valid || submitting">
        {{ submitting ? 'Saving...' : (isEditing ? 'Update Task' : 'Add Task') }}
      </button>
    </div>
  </form>
</div>
