<div class="auth-container">
  <div class="glass-panel auth-card">
    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Sign up to start managing tasks</p>
    </div>
    <form (ngSubmit)="register()" #registerForm="ngForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" class="form-control" name="name" [(ngModel)]="user.name" required placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" name="email" [(ngModel)]="user.email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" name="password" [(ngModel)]="user.password" required minlength="6" placeholder="Create a password (min 6 chars)">
      </div>
      <div class="error-text" *ngIf="errorMessage">{{ errorMessage }}</div>
      <button type="submit" class="btn-primary auth-btn" [disabled]="!registerForm.form.valid || loading">
        {{ loading ? 'Creating Account...' : 'Sign Up' }}
      </button>
    </form>
    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign In</a></p>
    </div>
  </div>
</div>
