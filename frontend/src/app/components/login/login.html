<div class="auth-container">
  <div class="glass-panel auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Sign in to manage your tasks</p>
    </div>
    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" name="email" [(ngModel)]="user.email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" name="password" [(ngModel)]="user.password" required placeholder="Enter your password">
      </div>
      <div class="error-text" *ngIf="errorMessage">{{ errorMessage }}</div>
      <button type="submit" class="btn-primary auth-btn" [disabled]="!loginForm.form.valid || loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Register</a></p>
    </div>
  </div>
</div>
