<div class="app-container">
  <header>
    <h1>{{ title }}</h1>
  </header>

  <main>
    <div class="add-todo">
      <input 
        type="text" 
        [(ngModel)]="newTodoTitle" 
        (keyup.enter)="addTodo()"
        placeholder="What needs to be done?"
      />
      <button (click)="addTodo()">Add Task</button>
    </div>
    <ul class="todo-list">
      <li *ngFor="let todo of todos" [class.completed]="todo.completed">
        
        <div class="todo-item-content" *ngIf="editingTodo?._id !== todo._id">
          <label class="checkbox-container">
            <input 
              type="checkbox" 
              [checked]="todo.completed" 
              (change)="toggleComplete(todo)"
            />
            <span class="checkmark"></span>
          </label>
          <span class="todo-title" (dblclick)="startEdit(todo)">{{ todo.title }}</span>
          
          <div class="actions">
            <button class="edit-btn" (click)="startEdit(todo)">Edit</button>
            <button class="delete-btn" (click)="deleteTodo(todo._id!)">Delete</button>
          </div>
        </div>

        <div class="todo-edit" *ngIf="editingTodo?._id === todo._id">
          <input 
            type="text" 
            [(ngModel)]="editTitle" 
            (keyup.enter)="saveEdit()"
            (keyup.escape)="cancelEdit()"
            autofocus
          />
          <div class="actions">
            <button class="save-btn" (click)="saveEdit()">Save</button>
            <button class="cancel-btn" (click)="cancelEdit()">Cancel</button>
          </div>
        </div>

      </li>
    </ul>
    <div *ngIf="todos.length === 0" class="empty-state">
      <p>No tasks yet. Add one above!</p>
    </div>
  </main>
</div>
